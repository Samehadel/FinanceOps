services:
  backend:
    build: ./backend
    networks:
      - default
      - financeops
    environment:
      DB_URL: jdbc:postgresql://db:5432/financeops
      DB_PASSWORD: ${DB_PASSWORD:-local-practice-only}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Practice123!}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-nano}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
  prometheus:
    volumes:
      - ./prometheus-config.deploy.yml:/etc/prometheus/prometheus.yml:ro
