name: financeops
services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: financeops
      POSTGRES_USER: financeops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-practice-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - financeops-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeops -d financeops"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/financeops
      DB_PASSWORD: ${DB_PASSWORD:-local-practice-only}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Practice123!}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
volumes:
  financeops-db:
