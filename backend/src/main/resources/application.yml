spring:
  application:
    name: financeops
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financeops}
    username: ${DB_USER:financeops}
    password: ${DB_PASSWORD:local-practice-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  web:
    error:
      include-message: never
      include-stacktrace: never
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
financeops:
  reference-date: 2026-10-12
  demo-password: ${DEMO_PASSWORD:Practice123!}
